    /* ===========================================================
       5. UTILIDADES GENERALES (TEMA, TOASTS, MODAL, ESCAPE)
       =========================================================== */
    function escapeHTML(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function applyTheme() {
      const root = document.documentElement;
      const sun = document.getElementById("icon-sun");
      const moon = document.getElementById("icon-moon");
      if (state.theme === "dark") {
        root.classList.add("dark");
        sun?.classList.remove("hidden");
        moon?.classList.add("hidden");
      } else {
        root.classList.remove("dark");
        sun?.classList.add("hidden");
        moon?.classList.remove("hidden");
      }
    }

    function toggleTheme() {
      state.theme = state.theme === "dark" ? "light" : "dark";
      localStorage.setItem("practica_unalm_theme", state.theme);
      applyTheme();
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      const styles = {
        success: "bg-unalm-700 text-white border-unalm-800",
        error: "bg-rose-700 text-white border-rose-800",
        info: "bg-slate-800 text-white border-slate-700"
      };
      const el = document.createElement("div");
      el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-sm font-medium transition-opacity duration-300 ${styles[type] || styles.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function showConfirmModal(title, message, onConfirm, confirmText = "Aceptar", isDanger = false) {
      const modal = document.getElementById("custom-modal");
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-message").textContent = message;
      const confirmBtn = document.getElementById("modal-confirm");
      const cancelBtn = document.getElementById("modal-cancel");

      confirmBtn.textContent = confirmText;
      confirmBtn.className = `px-4 py-2 rounded-lg text-sm font-medium text-white ${
        isDanger ? "bg-rose-600 hover:bg-rose-700" : "bg-unalm-700 hover:bg-unalm-800"
      }`;
      modal.classList.remove("hidden");

      const close = () => {
        modal.classList.add("hidden");
        confirmBtn.onclick = null;
        cancelBtn.onclick = null;
      };
      cancelBtn.onclick = close;
      confirmBtn.onclick = () => {
        close();
        onConfirm?.();
      };
    }

    function getCourse(courseId) {
      return state.courses.find(c => c.id === courseId) || { id: courseId, name: courseId, areaId: "competencias", questionCount: 0, topics: [] };
    }

    function formatScore(num) {
      return Number(num).toFixed(2);

    function hasAnyImage(q) {
      if (!q) return false;
      if (q.image && q.image.trim()) return true;
      if (q.explanationImage && q.explanationImage.trim()) return true;
      if (Array.isArray(q.optionImages) && q.optionImages.some(u => u && u.trim())) return true;
      return false;
    }

    function openImageLightbox(url) {
      if (!url) return;
      const modal = document.getElementById("image-lightbox");
      const img = document.getElementById("lightbox-img");
      if (!modal || !img) return;
      img.src = url;
      modal.classList.remove("hidden");
    }

    function closeImageLightbox() {
      const modal = document.getElementById("image-lightbox");
      const img = document.getElementById("lightbox-img");
      if (!modal || !img) return;
      modal.classList.add("hidden");
      img.src = "";
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeImageLightbox();
    });

      const clean = (url || "").trim();
      if (!clean) return "";
      const safe = escapeHTML(clean);
      return `
        <div class="mt-3">
          <img
            src="${safe}"
            alt="${escapeHTML(altText)}"
            onclick="event.stopPropagation(); openImageLightbox('${safe}')"
            onerror="this.parentElement.classList.add('hidden')"
            class="max-h-72 max-w-full object-contain rounded-xl border border-slate-200 dark:border-slate-700 bg-white p-1.5 cursor-zoom-in"
          />
        </div>
      `;

    function updateAdminImagePreview(inputEl, previewId) {
      const box = document.getElementById(previewId);
      if (!box) return;
      const val = (inputEl.value || "").trim();
      if (!val) {
        box.innerHTML = "";
        box.classList.add("hidden");
        return;
      }
      const safe = escapeHTML(val);
      box.classList.remove("hidden");
      box.innerHTML = `
        <img
          src="${safe}"
          alt="Vista previa"
          onclick="openImageLightbox('${safe}')"
          onerror="this.nextElementSibling.classList.remove('hidden'); this.classList.add('hidden');"
          class="max-h-32 max-w-full object-contain rounded-lg border border-slate-200 dark:border-slate-700 bg-white p-1 cursor-zoom-in"
        />
        <span class="hidden text-[11px] text-rose-600 dark:text-rose-400">No se pudo cargar la imagen. Verifica la URL o ruta.</span>
      `;
    }

    function loadLocalProgress() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            state.progress = {
              totalAnswered: parsed.totalAnswered || 0,
              totalCorrect: parsed.totalCorrect || 0,
              totalIncorrect: parsed.totalIncorrect || 0,
              byQuestion: parsed.byQuestion || {},
              simulacros: Array.isArray(parsed.simulacros) ? parsed.simulacros : []
            };
          }
        }
      } catch (e) {
        console.error("Error leyendo progreso local:", e);
      }
    }

    async function saveProgress() {
      try {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state.progress));
      } catch (e) {
        console.error("Error guardando progreso local:", e);
      }

      if (state.user) {
        try {
          await setDoc(doc(db, "users", state.user.uid), {
            email: state.user.email,
            displayName: state.user.displayName || "",
            progress: state.progress,
            updatedAt: new Date().toISOString()
          }, { merge: true });
        } catch (err) {
          console.error("Error guardando progreso en Firestore:", err);
          showToast("No se pudo sincronizar el progreso en Firestore. Revisa las reglas de seguridad.", "error");
        }
      }
    }

    async function loadUserProgressFromCloud(uid) {
      try {
        const snap = await getDoc(doc(db, "users", uid));
        if (snap.exists() && snap.data().progress) {
          const cloudProg = snap.data().progress;
          state.progress = {
            totalAnswered: cloudProg.totalAnswered || 0,
            totalCorrect: cloudProg.totalCorrect || 0,
            totalIncorrect: cloudProg.totalIncorrect || 0,
            byQuestion: cloudProg.byQuestion || {},
            simulacros: Array.isArray(cloudProg.simulacros) ? cloudProg.simulacros : []
          };
        } else {
          // Si es primera vez en la nube, sube el progreso local actual
          await saveProgress();
        }
      } catch (err) {
        console.error("Error cargando progreso de Firestore:", err);
      }
    }

    async function loadAppDataFromCloud() {
      try {
        const [currSnap, qSnap] = await Promise.all([
          getDoc(doc(db, "appData", "curriculum")),
          getDoc(doc(db, "appData", "questions"))
        ]);

        if (currSnap.exists() && Array.isArray(currSnap.data().courses) && currSnap.data().courses.length > 0) {
          state.courses = currSnap.data().courses;
        }
        if (qSnap.exists() && Array.isArray(qSnap.data().items) && qSnap.data().items.length > 0) {
          state.questions = qSnap.data().items;
        }
        state.cloudLoaded = true;
      } catch (err) {
        console.warn("Usando datos locales por defecto (Firestore no accesible o vacío):", err);
      }
    }

    }

    /* ===========================================================
       8. TEMPORIZADOR DE CUENTA REGRESIVA (28 FEB 2027 08:00 PET)
       =========================================================== */
    function updateCountdownDisplay() {
      const target = new Date(EXAM_DATE_ISO).getTime();
      const now = Date.now();
      const diff = Math.max(0, target - now);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      const setEl = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = String(val).padStart(2, "0");
      };
      const dEl = document.getElementById("cd-days");
      if (dEl) dEl.textContent = String(days);
      setEl("cd-hours", hours);
      setEl("cd-minutes", minutes);
      setEl("cd-seconds", seconds);
    }

    setInterval(updateCountdownDisplay, 1000);

    /* ===========================================================
       9. NAVEGACIÓN Y RENDERIZADO PRINCIPAL
       =========================================================== */
    function updateNavStyles() {
      document.querySelectorAll(".nav-btn").forEach(btn => {
        const active = btn.dataset.nav === state.view;
        btn.className = `nav-btn ${btn.id === "nav-admin-desktop" && !state.isAdmin ? "hidden" : ""} px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors ${
          active
            ? "bg-white dark:bg-slate-900 text-unalm-700 dark:text-unalm-200 shadow-sm"
            : "text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white"
        }`;
      });
      document.querySelectorAll(".mob-nav-btn").forEach(btn => {
        const active = btn.dataset.navMobile === state.view;
        btn.className = `mob-nav-btn ${btn.id === "nav-admin-mobile" && !state.isAdmin ? "hidden" : ""} py-2 rounded-lg text-xs font-medium text-center transition-colors ${
          active
            ? "bg-unalm-50 dark:bg-unalm-900/40 text-unalm-700 dark:text-unalm-200 font-semibold"
            : "text-slate-500 dark:text-slate-400"
        }`;
      });
    }

    function navigate(target) {
      if (target === "admin" && !state.isAdmin) {
        showToast("Acceso restringido al administrador.", "error");
        return;
      }
      if (state.view === "simulacro" && state.simulacro.phase === "running" && target !== "simulacro") {
        showConfirmModal(
          "Salir del simulacro",
          "Tienes un simulacro en curso. Si sales ahora se perderá este intento.",
          () => {
            stopSimulacroTimer();
            state.simulacro.phase = "setup";
            state.view = target;
            render();
          },
          "Salir",
          true
        );
        return;
      }
      state.view = target;
      if (target === "practicar" && state.practice.queue.length === 0) {
        buildPracticeQueue();
      }
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function render() {
      renderAuthControls();
      updateNavStyles();
      const root = document.getElementById("app-root");

      if (state.view === "inicio") root.innerHTML = renderInicio();
      else if (state.view === "temario") root.innerHTML = renderTemario();
      else if (state.view === "practicar") root.innerHTML = renderPracticar();
      else if (state.view === "simulacro") root.innerHTML = renderSimulacro();
      else if (state.view === "admin") root.innerHTML = renderAdmin();

      if (state.view === "inicio") updateCountdownDisplay();
    }

    /* ===========================================================
       12. VISTA: PRACTICAR
       =========================================================== */
    function jumpToPractice(courseId) {
      state.practice.courseId = courseId;
      state.practice.topic = "all";
      buildPracticeQueue();
      state.view = "practicar";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setPracticeFilter(courseId, topic) {
      state.practice.courseId = courseId;
      state.practice.topic = topic;
      buildPracticeQueue();
      render();
    }

    function buildPracticeQueue() {
      let list = [...state.questions];
      if (state.practice.courseId !== "all") {
        list = list.filter(q => q.courseId === state.practice.courseId);
      }
      if (state.practice.topic !== "all") {
        list = list.filter(q => q.topic === state.practice.topic);
      }
      state.practice.queue = shuffle(list);
      state.practice.index = 0;
      state.practice.selected = null;
      state.practice.answered = false;
    }

    async function selectPracticeOption(optIndex) {
      if (state.practice.answered) return;
      const q = state.practice.queue[state.practice.index];
      if (!q) return;

      state.practice.selected = optIndex;
      state.practice.answered = true;
      const isCorrect = optIndex === q.answer;

      state.progress.totalAnswered += 1;
      if (isCorrect) {
        state.progress.totalCorrect += 1;
        state.practice.sessionCorrect += 1;
      } else {
        state.progress.totalIncorrect += 1;
        state.practice.sessionIncorrect += 1;
      }

      if (!state.progress.byQuestion[q.id]) {
        state.progress.byQuestion[q.id] = { attempts: 0, correct: 0, lastCorrect: false };
      }
      state.progress.byQuestion[q.id].attempts += 1;
      if (isCorrect) state.progress.byQuestion[q.id].correct += 1;
      state.progress.byQuestion[q.id].lastCorrect = isCorrect;

      render();
      await saveProgress();
    }

    function nextPracticeQuestion() {
      if (state.practice.index < state.practice.queue.length - 1) {
        state.practice.index += 1;
        state.practice.selected = null;
        state.practice.answered = false;
        render();
      } else {
        showToast("Completaste todas las preguntas de este filtro. Reiniciando orden.", "info");
        buildPracticeQueue();
        render();
      }
    }

      const selectedCourse = state.courses.find(c => c.id === state.practice.courseId);
      const topics = selectedCourse ? selectedCourse.topics : [];
      const sessionScore = (state.practice.sessionCorrect * SCORE_CORRECT) + (state.practice.sessionIncorrect * SCORE_INCORRECT);

      const q = state.practice.queue[state.practice.index];
      const letters = ["A", "B", "C", "D", "E"];

      return `
        <div class="max-w-3xl mx-auto space-y-5">
          <!-- Filtros y puntaje de sesión -->

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 flex-1">

                <select onchange="setPracticeFilter(this.value, 'all')" class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                  <option value="all" ${state.practice.courseId === "all" ? "selected" : ""}>Todos los cursos</option>
                  ${state.courses.map(c => `<option value="${c.id}" ${state.practice.courseId === c.id ? "selected" : ""}>${escapeHTML(c.name)}</option>`).join("")}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Tema</label>
                <select onchange="setPracticeFilter('${state.practice.courseId}', this.value)" ${state.practice.courseId === "all" ? "disabled" : ""} class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm disabled:opacity-50">
                  <option value="all" ${state.practice.topic === "all" ? "selected" : ""}>Todos los temas</option>
                  ${topics.map(t => `<option value="${escapeHTML(t)}" ${state.practice.topic === t ? "selected" : ""}>${escapeHTML(t)}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="text-right shrink-0 px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
              <div class="text-[11px] text-slate-500 dark:text-slate-400">Puntaje sesión</div>
              <div class="text-sm font-bold text-unalm-700 dark:text-unalm-200">${formatScore(sessionScore)} pts</div>
            </div>
          </div>

          ${!q ? `
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-8 text-center">
              <p class="text-sm text-slate-600 dark:text-slate-300">No hay preguntas registradas para el filtro seleccionado.</p>
            </div>
          ` : `
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-7 space-y-5">
              <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-1 rounded-md bg-unalm-50 dark:bg-unalm-900/50 text-unalm-700 dark:text-unalm-200 font-semibold">${escapeHTML(getCourse(q.courseId).name)}</span>
                  <span class="text-slate-500 dark:text-slate-400">${escapeHTML(q.topic)}</span>
                </div>
                <span class="text-slate-500 dark:text-slate-400 font-medium">Pregunta ${state.practice.index + 1} de ${state.practice.queue.length}</span>
              </div>

              <p class="text-base sm:text-lg font-medium text-slate-900 dark:text-white leading-relaxed">${escapeHTML(q.question)}</p>
              ${renderImageBlock(q.image, "Imagen del enunciado")}

              <div class="space-y-2.5">
                ${q.options.map((opt, idx) => {
                  let cls = "bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 hover:border-unalm-700 text-slate-800 dark:text-slate-100";
                  if (state.practice.answered) {
                    if (idx === q.answer) cls = "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-600 text-emerald-900 dark:text-emerald-100";
                    else if (idx === state.practice.selected) cls = "bg-rose-50 dark:bg-rose-950/50 border-rose-600 text-rose-900 dark:text-rose-100";
                    else cls = "bg-slate-50 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800 text-slate-400";
                  }
                  const optImg = q.optionImages?.[idx] || "";
                  return `
                    <button onclick="selectPracticeOption(${idx})" ${state.practice.answered ? "disabled" : ""} class="w-full text-left p-3.5 rounded-xl border transition-colors flex items-start gap-3 ${cls}">
                      <span class="w-6 h-6 shrink-0 rounded bg-slate-100 dark:bg-slate-800 text-xs font-bold flex items-center justify-center text-slate-700 dark:text-slate-300">${letters[idx]}</span>
                      <div class="flex-1 min-w-0">
                        ${opt ? `<span class="text-sm sm:text-base block">${escapeHTML(opt)}</span>` : ""}
                        ${renderOptionImage(optImg, "Alternativa " + letters[idx])}
                      </div>
                    </button>
                  `;
                }).join("")}
              </div>

              ${state.practice.answered ? `
                <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 space-y-1.5">
                  <div class="text-sm font-semibold ${state.practice.selected === q.answer ? "text-emerald-700 dark:text-emerald-400" : "text-rose-700 dark:text-rose-400"}">
                    ${state.practice.selected === q.answer ? "Correcto (+1.00 pt)" : `Incorrecto (-0.17 pts) — Respuesta correcta: ${letters[q.answer]}`}
                  </div>
                  <p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${escapeHTML(q.explanation)}</p>
                  ${renderImageBlock(q.explanationImage, "Imagen de la resolución")}
                </div>
                <div class="flex justify-end">
                  <button onclick="nextPracticeQuestion()" class="px-5 py-2.5 rounded-lg bg-unalm-700 hover:bg-unalm-800 text-white text-sm font-medium">
                    Siguiente pregunta
                  </button>
                </div>
              ` : ""}
            </div>
          `}
        </div>
      `;
    }

    /* ===========================================================
       13. VISTA: SIMULACRO CRONOMETRADO
       =========================================================== */
    function stopSimulacroTimer() {
      if (state.simulacro.timerId) {
        clearInterval(state.simulacro.timerId);
        state.simulacro.timerId = null;
      }
    }

    function formatTimer(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h > 0
        ? `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`
        : `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function startSimulacro(count, minutes) {
      const total = count === "all" ? state.questions.length : Math.min(Number(count), state.questions.length);
      if (total === 0) {
        showToast("No hay preguntas disponibles para iniciar el simulacro.", "error");
        return;
      }
      stopSimulacroTimer();
      state.simulacro = {
        phase: "running",
        questions: shuffle(state.questions).slice(0, total),
        answers: {},
        currentIndex: 0,
        secondsLeft: minutes * 60,
        timerId: null
      };

      state.simulacro.timerId = setInterval(() => {
        state.simulacro.secondsLeft -= 1;
        const el = document.getElementById("sim-timer");
        if (el) el.textContent = formatTimer(Math.max(0, state.simulacro.secondsLeft));
        if (state.simulacro.secondsLeft <= 0) {
          finishSimulacro(true);
        }
      }, 1000);
      render();
    }

    function selectSimulacroOption(optIdx) {
      const idx = state.simulacro.currentIndex;
      if (state.simulacro.answers[idx] === optIdx) {
        delete state.simulacro.answers[idx];
      } else {
        state.simulacro.answers[idx] = optIdx;
      }
      render();
    }

    function jumpSimulacro(idx) {
      state.simulacro.currentIndex = idx;
      render();
    }

    function confirmFinishSimulacro() {
      const answered = Object.keys(state.simulacro.answers).length;
      const total = state.simulacro.questions.length;
      showConfirmModal(
        "Finalizar simulacro",
        `Has respondido ${answered} de ${total} preguntas (${total - answered} en blanco). Se calificará con +1.00 acierto, -0.17 error y 0.00 en blanco.`,
        () => finishSimulacro(false),
        "Entregar"
      );
    }

    async function finishSimulacro(auto = false) {
      stopSimulacroTimer();
      state.simulacro.phase = "results";

      let correct = 0, incorrect = 0, blank = 0;
      state.simulacro.questions.forEach((q, idx) => {
        const ans = state.simulacro.answers[idx];
        if (ans === undefined) {
          blank++;
        } else {
          const ok = ans === q.answer;
          state.progress.totalAnswered += 1;
          if (ok) {
            correct++;
            state.progress.totalCorrect += 1;
          } else {
            incorrect++;
            state.progress.totalIncorrect += 1;
          }
          if (!state.progress.byQuestion[q.id]) {
            state.progress.byQuestion[q.id] = { attempts: 0, correct: 0, lastCorrect: false };
          }
          state.progress.byQuestion[q.id].attempts += 1;
          if (ok) state.progress.byQuestion[q.id].correct += 1;
          state.progress.byQuestion[q.id].lastCorrect = ok;
        }
      });

      const score = (correct * SCORE_CORRECT) + (incorrect * SCORE_INCORRECT);
      state.progress.simulacros.unshift({
        date: new Date().toISOString(),
        total: state.simulacro.questions.length,
        correct,
        incorrect,
        blank,
        score: Number(score.toFixed(2))
      });
      state.progress.simulacros = state.progress.simulacros.slice(0, 20);

      if (auto) showToast("Tiempo finalizado. Simulacro calificado automáticamente.", "info");
      render();
      await saveProgress();
    }

    // --- Gestión de Cursos y Temas ---
    async function handleSaveCourse(e) {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value.trim();
      const areaId = form.areaId.value;
      const questionCount = Number(form.questionCount.value) || 0;
      const topics = form.topics.value.split("\n").map(t => t.trim()).filter(Boolean);

      if (!name) return;

      if (state.admin.editingCourseId) {
        const idx = state.courses.findIndex(c => c.id === state.admin.editingCourseId);
        if (idx !== -1) {
          state.courses[idx] = { ...state.courses[idx], name, areaId, questionCount, topics };
        }
        state.admin.editingCourseId = null;
      } else {
        const id = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-") + "-" + Date.now().toString().slice(-4);
        state.courses.push({ id, areaId, name, questionCount, topics });
      }
      render();
      await saveCurriculumToCloud();
    }

    // --- Gestión de Preguntas ---
    async function handleSaveQuestion(e) {
      e.preventDefault();
      const form = e.target;
      const courseId = form.courseId.value;
      const topic = form.topic.value.trim() || "General";
      const question = form.question.value.trim();
      const image = form.image.value.trim();
      const options = [0, 1, 2, 3, 4].map(i => form[`opt${i}`].value.trim());
      const optionImages = [0, 1, 2, 3, 4].map(i => form[`optImg${i}`].value.trim());
      const answer = Number(form.answer.value);
      const explanation = form.explanation.value.trim();
      const explanationImage = form.explanationImage.value.trim();

      const hasInvalidOption = options.some((text, i) => !text && !optionImages[i]);
      if (!question || hasInvalidOption) {
        showToast("Completa el enunciado y asegúrate de que cada alternativa tenga texto o imagen.", "error");
        return;
      }

      const payload = {
        courseId,
        topic,
        question,
        image,
        options,
        optionImages,
        answer,
        explanation,
        explanationImage
      };

      if (state.admin.editingQuestionId) {
        const idx = state.questions.findIndex(q => q.id === state.admin.editingQuestionId);
        if (idx !== -1) {
          state.questions[idx] = { ...state.questions[idx], ...payload };
        }
        state.admin.editingQuestionId = null;
      } else {
        state.questions.unshift({
          id: "q-" + Date.now(),
          ...payload
        });
      }
      render();
      await saveQuestionsToCloud();
    }

      window.scrollTo({ top: 0, behavior: "smooth" });

    function exportQuestionsJSON() {
      const blob = new Blob([JSON.stringify(state.questions, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "banco-preguntas-unalm.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importQuestionsJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const arr = JSON.parse(ev.target.result);
          if (!Array.isArray(arr)) throw new Error("Formato inválido");
          let added = 0;
          arr.forEach((item, i) => {
            if (item.question && Array.isArray(item.options) && item.options.length === 5) {
              state.questions.unshift({
                id: item.id || `imp-${Date.now()}-${i}`,
                courseId: item.courseId || state.courses[0]?.id || "rv",
                topic: item.topic || "General",
                question: String(item.question),
                image: item.image ? String(item.image) : "",
                options: item.options.map(String),
                optionImages: Array.isArray(item.optionImages) ? item.optionImages.slice(0, 5).map(u => String(u || "")) : ["", "", "", "", ""],
                answer: Math.min(4, Math.max(0, Number(item.answer) || 0)),
                explanation: item.explanation || "",
                explanationImage: item.explanationImage ? String(item.explanationImage) : ""
              });
              added++;
            }
          });
          render();
          await saveQuestionsToCloud();
          showToast(`Se importaron ${added} preguntas.`, "success");
        } catch {
          showToast("El archivo JSON no tiene un formato válido.", "error");
        }
      };
      reader.readAsText(file);
    }

                    <div class="flex gap-2 shrink-0">
                      <button onclick="editCourse('${c.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700">Editar</button>
                      <button onclick="deleteCourse('${c.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40">Eliminar</button>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div class="lg:col-span-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 space-y-4">
                <h2 class="font-bold text-base">${editingQuestion ? "Editar pregunta" : "Nueva pregunta"}</h2>
                <form onsubmit="handleSaveQuestion(event)" class="space-y-3">
                  <div>
                    <label class="block text-xs font-medium mb-1">Curso</label>
                    <select name="courseId" class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                      ${state.courses.map(c => `<option value="${c.id}" ${editingQuestion?.courseId === c.id ? "selected" : ""}>${escapeHTML(c.name)}</option>`).join("")}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium mb-1">Tema</label>
                    <input name="topic" required value="${escapeHTML(editingQuestion?.topic || "")}" placeholder="Nombre del tema" class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium mb-1">Enunciado</label>
                    <textarea name="question" rows="3" required class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">${escapeHTML(editingQuestion?.question || "")}</textarea>
                  </div>
                  <div>
                    <label class="block text-xs font-medium mb-1">Imagen del enunciado (URL o ruta, ej: img/figura1.png)</label>
                    <input name="image" oninput="updateAdminImagePreview(this, 'preview-q-img')" value="${escapeHTML(editingQuestion?.image || "")}" placeholder="Opcional: img/figura1.png o https://..." class="w-full px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                    <div id="preview-q-img" class="mt-2 ${editingQuestion?.image ? "" : "hidden"}">
                      ${editingQuestion?.image ? `<img src="${escapeHTML(editingQuestion.image)}" alt="Vista previa" onclick="openImageLightbox('${escapeHTML(editingQuestion.image)}')" onerror="this.nextElementSibling.classList.remove('hidden'); this.classList.add('hidden');" class="max-h-32 max-w-full object-contain rounded-lg border border-slate-200 dark:border-slate-700 bg-white p-1 cursor-zoom-in" /><span class="hidden text-[11px] text-rose-600 dark:text-rose-400">No se pudo cargar la imagen. Verifica la URL o ruta.</span>` : ""}
                    </div>
                  </div>
                  <div class="space-y-2.5">
                    <label class="block text-xs font-medium">Alternativas (A - E) — Texto, imagen o ambos</label>
                    ${["A", "B", "C", "D", "E"].map((l, i) => {
                      const optImgVal = editingQuestion?.optionImages?.[i] || "";
                      return `
                        <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-1.5">
                          <input name="opt${i}" placeholder="Texto alternativa ${l}" value="${escapeHTML(editingQuestion?.options?.[i] || "")}" class="w-full px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                          <input name="optImg${i}" oninput="updateAdminImagePreview(this, 'preview-opt-img-${i}')" placeholder="URL de imagen ${l} (opcional)" value="${escapeHTML(optImgVal)}" class="w-full px-3 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs" />
                          <div id="preview-opt-img-${i}" class="mt-1 ${optImgVal ? "" : "hidden"}">
                            ${optImgVal ? `<img src="${escapeHTML(optImgVal)}" alt="Vista previa ${l}" onclick="openImageLightbox('${escapeHTML(optImgVal)}')" onerror="this.nextElementSibling.classList.remove('hidden'); this.classList.add('hidden');" class="max-h-24 max-w-full object-contain rounded border border-slate-200 dark:border-slate-700 bg-white p-1 cursor-zoom-in" /><span class="hidden text-[11px] text-rose-600 dark:text-rose-400">No se pudo cargar la imagen.</span>` : ""}
                          </div>
                        </div>
                      `;
                    }).join("")}
                  </div>
                  <div>
                    <label class="block text-xs font-medium mb-1">Respuesta correcta</label>
                    <select name="answer" class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                      ${["A", "B", "C", "D", "E"].map((l, i) => `<option value="${i}" ${editingQuestion?.answer === i ? "selected" : ""}>Alternativa ${l}</option>`).join("")}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium mb-1">Explicación</label>
                    <textarea name="explanation" rows="2" class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">${escapeHTML(editingQuestion?.explanation || "")}</textarea>
                  </div>
                  <div>
                    <label class="block text-xs font-medium mb-1">Imagen de la resolución (URL o ruta, opcional)</label>
                    <input name="explanationImage" oninput="updateAdminImagePreview(this, 'preview-exp-img')" value="${escapeHTML(editingQuestion?.explanationImage || "")}" placeholder="Opcional: img/resolucion1.png o https://..." class="w-full px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                    <div id="preview-exp-img" class="mt-2 ${editingQuestion?.explanationImage ? "" : "hidden"}">
                      ${editingQuestion?.explanationImage ? `<img src="${escapeHTML(editingQuestion.explanationImage)}" alt="Vista previa resolución" onclick="openImageLightbox('${escapeHTML(editingQuestion.explanationImage)}')" onerror="this.nextElementSibling.classList.remove('hidden'); this.classList.add('hidden');" class="max-h-32 max-w-full object-contain rounded-lg border border-slate-200 dark:border-slate-700 bg-white p-1 cursor-zoom-in" /><span class="hidden text-[11px] text-rose-600 dark:text-rose-400">No se pudo cargar la imagen. Verifica la URL o ruta.</span>` : ""}
                    </div>
                  </div>
                  <div class="flex gap-2">
                    <button type="submit" class="flex-1 py-2.5 rounded-lg bg-unalm-700 hover:bg-unalm-800 text-white text-sm font-medium">
                      ${editingQuestion ? "Guardar cambios" : "Guardar pregunta"}
                    </button>
                    ${editingQuestion ? `<button type="button" onclick="state.admin.editingQuestionId=null; render();" class="px-4 py-2.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm">Cancelar</button>` : ""}
                  </div>
                </form>

                <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex gap-2">
                  <button onclick="exportQuestionsJSON()" class="flex-1 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium hover:bg-slate-50 dark:hover:bg-slate-800">Exportar JSON</button>
                  <label class="flex-1 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium text-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
                    Importar JSON
                    <input type="file" accept=".json" onchange="importQuestionsJSON(event)" class="hidden" />
                  </label>
                </div>
              </div>

              <div class="lg:col-span-7 space-y-3">
                <div class="flex items-center justify-between gap-3">
                  <select onchange="state.admin.filterCourse=this.value; render();" class="px-3 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs">
                    <option value="all">Todos los cursos (${state.questions.length})</option>
                    ${state.courses.map(c => `<option value="${c.id}" ${state.admin.filterCourse === c.id ? "selected" : ""}>${escapeHTML(c.name)}</option>`).join("")}
                  </select>
                  <span class="text-xs text-slate-500">${filteredQs.length} mostradas</span>
                </div>

                <div class="space-y-2.5 max-h-[680px] overflow-y-auto pr-1">
                  ${filteredQs.map(q => `
                    <div class="p-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-start justify-between gap-3">
                      <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-2 text-[11px] font-semibold text-unalm-700 dark:text-unalm-200">
                          <span>${escapeHTML(getCourse(q.courseId).name)} • ${escapeHTML(q.topic)}</span>
                          ${hasAnyImage(q) ? '<span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium">Con imagen</span>' : ""}
                        </div>
                        <p class="text-xs text-slate-800 dark:text-slate-100 mt-1 line-clamp-2">${escapeHTML(q.question)}</p>
                      </div>
                      <div class="flex gap-1.5 shrink-0">
                        <button onclick="editQuestion('${q.id}')" class="px-2.5 py-1 rounded text-xs bg-slate-100 dark:bg-slate-800">Editar</button>
                        <button onclick="deleteQuestion('${q.id}')" class="px-2.5 py-1 rounded text-xs text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40">Eliminar</button>
                      </div>
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
          `}
        </div>
      `;
    }

    /* ===========================================================
       15. EXPONER FUNCIONES AL ÁMBITO GLOBAL E INICIALIZAR
       =========================================================== */
    Object.assign(window, {
      state,
      navigate,
      toggleTheme,
      loginWithGoogle,
      logoutGoogle,
      jumpToPractice,
      setPracticeFilter,
      selectPracticeOption,
      nextPracticeQuestion,
      startSimulacro,
      selectSimulacroOption,
      jumpSimulacro,
      confirmFinishSimulacro,
      setAdminSubtab,
      handleSaveCourse,
      editCourse,
      deleteCourse,
      handleSaveQuestion,
      editQuestion,
      deleteQuestion,
      exportQuestionsJSON,
      importQuestionsJSON,
      publishDefaultDataToCloud,
      openImageLightbox,
      closeImageLightbox,
      updateAdminImagePreview,
      render
    });

    async function init() {
      const savedTheme = localStorage.getItem("practica_unalm_theme");
      state.theme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      applyTheme();
      loadLocalProgress();

      await loadAppDataFromCloud();
      buildPracticeQueue();
      render();

      onAuthStateChanged(auth, async (user) => {
        state.user = user;
        state.isAdmin = Boolean(user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
        if (user) {
          await loadUserProgressFromCloud(user.uid);
        } else {
          loadLocalProgress();
        }
        render();
      });
    }

    init();
  </script>
</body>
</html>
